name: Build Linux ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y haxe neko g++ make pkg-config \
            libgl1-mesa-dev libglu1-mesa-dev libasound2-dev \
            libpulse-dev libx11-dev libxext-dev libxi-dev libxrandr-dev \
            libopenal-dev libsdl2-dev libvorbis-dev libogg-dev \
            libpng-dev libjpeg-dev zlib1g-dev libcurl4-openssl-dev

      - name: Configurar haxelib
        run: |
          mkdir -p ~/haxelib
          haxelib setup ~/haxelib
          haxelib --global install hmm
          haxelib --global run hmm setup

      - name: Instalar librerias del proyecto
        run: |
          haxelib run hmm install || haxelib run hmm install --quiet

      - name: Desactivar videos y Lua (version ligera)
        run: |
          sed -i '/VIDEOS_ALLOWED/d' Project.xml || true
          sed -i '/LUA_ALLOWED/d' Project.xml || true

      - name: Compilar
        run: |
          haxelib run lime build linux -release -arm64 -Dlinux

      - name: Subir resultado
        uses: actions/upload-artifact@v4
        with:
          name: psych-linux-arm64
          path: export/release/linux/bin
